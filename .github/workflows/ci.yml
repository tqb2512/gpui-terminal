name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked -p terminal_client
      - name: Upload Windows build
        id: windows-artifact
        uses: actions/upload-artifact@v7
        with:
          name: terminal-client-windows-x64
          path: target/debug/terminal_client.exe
          if-no-files-found: error
          overwrite: true
      - name: Add Windows download link
        env:
          ARTIFACT_URL: ${{ steps.windows-artifact.outputs.artifact-url }}
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "[Download Windows build (ZIP)]($env:ARTIFACT_URL)"

  unsupported-platform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: cargo test --locked -p terminal_client --test unsupported_platform
