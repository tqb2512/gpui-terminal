[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
terminal_view = { path = "crates/terminal_view" }

[workspace.lints.clippy]
expect_used = "warn"
unwrap_used = "warn"
