[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
hosts = { path = "crates/hosts" }
rand = "0.10"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
rusqlite = { version = "0.43", features = ["bundled"] }
ssh = { path = "crates/ssh" }
tempfile = "3"
terminal = { path = "crates/terminal" }
terminal_view = { path = "crates/terminal_view" }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
zeroize = "1"

[workspace.lints.clippy]
expect_used = "warn"
unwrap_used = "warn"
