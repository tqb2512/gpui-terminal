[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
rusqlite = { version = "0.43", features = ["bundled"] }
ssh = { path = "crates/ssh" }
tempfile = "3"
terminal_view = { path = "crates/terminal_view" }
thiserror = "2"

[workspace.lints.clippy]
expect_used = "warn"
unwrap_used = "warn"
